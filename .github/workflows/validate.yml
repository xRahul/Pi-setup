name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          cp example.env .env
          cp example_pihole.env pihole.env
          sed -i 's#^\([A-Za-z_][A-Za-z0-9_]*\)=\s*$#\1=/tmp/ci-placeholder#' .env
          docker compose config -q
          docker compose config --no-interpolate -q

  config-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install pyyaml
      - name: Run config audit
        run: |
          cp example.env .env
          bash scripts/audit-config.sh

  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare placeholder env
        run: |
          cp example.env .env
          cp example_pihole.env pihole.env
          sed -i 's#^\([A-Za-z_][A-Za-z0-9_]*\)=\s*$#\1=/tmp/ci-placeholder#' .env
          printf 'CADDY_SITE_PATH=/tmp/caddy-site\nCADDY_DATA_PATH=/tmp/caddy-data\nCADDY_CONFIG_PATH=/tmp/caddy-config\n' >> .env
          # 40-char dummy: cloudflare DNS module validates token format at provision time
          printf 'CLOUDFLARE_API_TOKEN=citest0000000000000000000000000000000000\n' >> .env
          mkdir -p /tmp/caddy-site /tmp/caddy-data /tmp/caddy-config
      - name: Build caddy image
        run: docker compose build --progress=plain caddy
      - name: Validate Caddyfile
        run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
