name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          cp example.env .env
          cp example_pihole.env pihole.env
          sed -i 's#^\([A-Za-z_][A-Za-z0-9_]*\)=\s*$#\1=/tmp/ci-placeholder#' .env
          docker compose config -q
          docker compose config --no-interpolate -q

  config-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install pyyaml
      - name: Run config audit
        run: |
          cp example.env .env
          bash scripts/audit-config.sh

  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare placeholder env
        run: |
          cp example.env .env
          cp example_pihole.env pihole.env
          # fill empty placeholders, then replace (not append) to avoid duplicate-key dotenv ambiguity
          sed -i 's#^\([A-Za-z_][A-Za-z0-9_]*\)=\s*$#\1=/tmp/ci-placeholder#' .env
          sed -i 's#^CADDY_SITE_PATH=.*#CADDY_SITE_PATH=/tmp/caddy-site#; s#^CADDY_DATA_PATH=.*#CADDY_DATA_PATH=/tmp/caddy-data#; s#^CADDY_CONFIG_PATH=.*#CADDY_CONFIG_PATH=/tmp/caddy-config#; s#^CLOUDFLARE_API_TOKEN=.*#CLOUDFLARE_API_TOKEN=citest0000000000000000000000000000000000#' .env
          mkdir -p /tmp/caddy-site /tmp/caddy-data /tmp/caddy-config
      - name: Build caddy image
        run: docker compose build --progress=plain caddy
      - name: Validate Caddyfile
        run: |
          # caddy joins tailscale's network namespace (network_mode: service:tailscale);
          # no tailscale container on CI, so override to bridge for validation only
          printf 'services:\n  caddy:\n    network_mode: bridge\n' > ci-override.yml
          docker compose -f docker-compose.yml -f ci-override.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
