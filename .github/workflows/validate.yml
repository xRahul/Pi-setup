name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          bash scripts/ci-env.sh
          docker compose config -q
          docker compose config --no-interpolate -q

  config-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install pyyaml
      - name: Run config audit
        run: |
          bash scripts/ci-env.sh
          bash scripts/audit-config.sh

  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare placeholder env
        run: bash scripts/ci-env.sh
      - name: Build caddy image
        run: docker compose build --progress=plain caddy
      - name: Validate Caddyfile
        run: |
          # caddy joins tailscale's network namespace (network_mode: service:tailscale);
          # no tailscale container on CI, so override to bridge for validation only
          printf 'services:\n  caddy:\n    network_mode: bridge\n' > "$RUNNER_TEMP/ci-override.yml"
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-override.yml" run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
